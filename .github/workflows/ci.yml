name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track the toolchain the module declares, so CI cannot drift
          # from what builds locally.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: build
        run: go build ./cmd/box

      # The runner has no KVM, so the microVM paths cannot run here. Check the
      # binary at least starts and reports its commands.
      - name: smoke
        run: |
          go run ./cmd/box --help
          go run ./cmd/box --version

  # Known vulnerabilities reachable from box's code, in its dependencies and
  # in the Go toolchain go.mod pins. A fix is usually a bump of either.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The seed corpora already run as part of go test; this explores past them
  # for a short while on every change. A crasher lands in testdata/fuzz and
  # is uploaded, so it can be committed as a regression test.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/sandbox, name: FuzzExtractArchive }
          - { pkg: ./internal/boxfile, name: FuzzParse }
          - { pkg: ./internal/agent, name: FuzzUnauthenticatedPeer }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: fuzz
        run: go test "${{ matrix.target.pkg }}" -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 60s

      - name: keep the crasher
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crasher-${{ matrix.target.name }}
          path: ${{ matrix.target.pkg }}/testdata/fuzz
