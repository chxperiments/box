[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdbox"
version = "0.1.0"
description = "Python SDK for box: microVM sandboxes that start in milliseconds"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://github.com/chxperiments/bluebox"

[tool.setuptools]
packages = ["sdbox"]
